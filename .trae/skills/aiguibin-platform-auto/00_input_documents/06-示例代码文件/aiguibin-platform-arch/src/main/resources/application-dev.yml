# 开发环境配置
spring:
  datasource:
    dynamic:
      primary: master
      strict: false
      grace-destroy: false
      datasource:
        # 配置库
        master:
          url: jdbc:mysql://localhost:3306/platform_config?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource
          druid:
            initial-size: 5
            max-active: 20
            min-idle: 5
            max-wait: 60000

        # DEV环境数据源组 (7个数据库)
        dev-ncms-credit:
          url: jdbc:mysql://localhost:3306/ncms_credit?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource
        dev-ncms-rule:
          url: jdbc:mysql://localhost:3306/ncms_rule_base?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource
        dev-ncms-collateral:
          url: jdbc:mysql://localhost:3306/ncms_collateral?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource
        dev-ncms-customer:
          url: jdbc:mysql://localhost:3306/ncms_customer?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource
        dev-ncms-product:
          url: jdbc:mysql://localhost:3306/ncms_product?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource
        dev-ncms-account:
          url: jdbc:mysql://localhost:3306/ncms_account?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: root
