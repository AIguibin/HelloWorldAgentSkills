          type: com.alibaba.druid.pool.DruidDataSource

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SVN配置
svn:
  url: svn://localhost/arch-platform
  username: svnuser
  password: svnpass
  work-copy-path: ${user.home}/svn-work/arch-platform
  doc-relative-path: docs
  result-relative-path: results

# 飞秋配置
feiQ:
  server-url: http://localhost:8080
  server-port: 8080
  receivers: user1,user2,user3

# 定时任务配置
schedule:
  dev:
    cron: "0 0 2 * * ?"
  sit:
    cron: "0 0 4 * * ?"
  uat:
    cron: "0 0 6 * * ?"
